<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>祖孙三代比童年 - 拖拽小游戏</title>
    <style>
        :root {
            --bg: #f9f5ee;
            --card-bg: #fffefb;
            --card-shadow: 0 2px 8px rgba(120, 100, 70, 0.10);
            --card-shadow-hover: 0 6px 20px rgba(120, 100, 70, 0.16);
            --text-primary: #4a3728;
            --text-secondary: #6b5c4d;
            --text-light: #8b7b6b;
            --zone-grand-bg: #fdf5eb;
            --zone-grand-border: #e0ccaa;
            --zone-parent-bg: #eef4f8;
            --zone-parent-border: #b8cfde;
            --zone-self-bg: #ecf8ef;
            --zone-self-border: #a3cfa8;
            --pool-bg: #fffefb;
            --pool-border: #e0d9ce;
            --highlight-glow: 0 0 0 6px rgba(130, 160, 140, 0.25);
            --transition-fast: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(180, 160, 130, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 75% 60%, rgba(140, 170, 140, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 85%, rgba(160, 180, 200, 0.05) 0%, transparent 55%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        .main-container {
            width: 100%;
            max-width: 1050px;
            background: rgba(255, 254, 251, 0.65);
            border-radius: 28px;
            padding: 24px 22px 28px;
            box-shadow: 0 4px 24px rgba(100, 80, 50, 0.07), 0 1px 3px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(200, 185, 160, 0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
        }
        .header .icon-row {
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 4px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }
        .header h1 {
            font-size: 1.55rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.04em;
            margin: 0;
        }
        .header .subtitle {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 2px;
        }

        /* 物品池 */
        .item-pool-section {
            margin-bottom: 20px;
        }
        .item-pool-label {
            font-size: 0.82rem;
            color: var(--text-light);
            margin-bottom: 8px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .item-pool-label::before,
        .item-pool-label::after {
            content: '';
            display: inline-block;
            width: 32px;
            height: 1px;
            background: #d5c9b8;
            border-radius: 1px;
        }
        .item-pool {
            display: grid;
            grid-template-columns: repeat(5, auto);
            justify-content: center;
            gap: 10px;
            padding: 14px 16px;
            background: var(--pool-bg);
            border-radius: 20px;
            border: 2px dashed var(--pool-border);
            min-height: 70px;
            transition: all var(--transition-fast);
            position: relative;
        }
        @media (max-width: 600px) {
            .item-pool {
                grid-template-columns: repeat(3, auto);
                gap: 8px;
            }
        }
        .item-pool.drag-over-highlight {
            border-color: #b0c4a0;
            background: #f9faf6;
            box-shadow: var(--highlight-glow);
        }
        .item-pool.empty-hint::after {
            content: '👆 物品都已分到下方方框中啦';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c5b9a6;
            font-size: 0.9rem;
            pointer-events: none;
            letter-spacing: 0.03em;
        }

        /* 物品卡片 */
        .item-card {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 14px;
            background: var(--card-bg);
            border-radius: 14px;
            border: 1.5px solid #e8e0d4;
            cursor: grab;
            font-size: 0.95rem;
            color: var(--text-primary);
            font-weight: 500;
            letter-spacing: 0.03em;
            white-space: nowrap;
            transition: all var(--transition-fast);
            box-shadow: var(--card-shadow);
            position: relative;
            z-index: 1;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .item-card:active {
            cursor: grabbing;
        }
        .item-card:hover {
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-2px);
            border-color: #d5c8b2;
        }
        .item-card.dragging {
            opacity: 0.45;
            transform: scale(0.94);
            border-style: dashed;
            z-index: 0;
        }
        .item-card .emoji {
            font-size: 1.25rem;
            line-height: 1;
        }
        .item-card.house-type {
            border-left: 3px solid #d4a574;
        }
        .item-card.food-type {
            border-left: 3px solid #c4a882;
        }
        .item-card.transport-type {
            border-left: 3px solid #8fadc4;
        }

        /* 拖拽克隆体 */
        .drag-clone {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.92;
            transform: scale(1.08);
            box-shadow: 0 12px 32px rgba(80, 60, 30, 0.22);
            border-radius: 14px;
            padding: 9px 14px;
            background: #fffefb;
            border: 2px solid #c8b898;
            font-size: 0.95rem;
            font-weight: 500;
            color: #4a3728;
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: none;
            display: none;
        }

        /* 投放区域 */
        .drop-zones {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .drop-zone {
            flex: 1;
            min-width: 240px;
            max-width: 340px;
            min-height: 300px;
            border-radius: 22px;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all var(--transition-fast);
            position: relative;
            border: 2.5px solid transparent;
        }
        .drop-zone .zone-header {
            text-align: center;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.05em;
            padding: 6px 14px;
            border-radius: 20px;
            align-self: center;
            margin-bottom: 4px;
        }
        .drop-zone .zone-inner {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-content: flex-start;
            justify-content: center;
            padding: 8px 4px;
            border-radius: 14px;
            min-height: 180px;
        }
        .drop-zone .zone-empty-hint {
            color: #c5bfb2;
            font-size: 0.85rem;
            text-align: center;
            width: 100%;
            align-self: center;
            pointer-events: none;
            letter-spacing: 0.03em;
        }

        .zone-grand {
            background: #fdf5eb;
            border-color: #e0ccaa;
        }
        .zone-grand .zone-header {
            background: #fdf0e0;
            color: #8b5e3c;
        }
        .zone-grand.drag-over-highlight {
            border-color: #c8955c;
            background: #fef8f1;
            box-shadow: 0 0 0 8px rgba(190, 150, 100, 0.13);
        }

        .zone-parent {
            background: #eef4f8;
            border-color: #b8cfde;
        }
        .zone-parent .zone-header {
            background: #e4eef5;
            color: #4a6d85;
        }
        .zone-parent.drag-over-highlight {
            border-color: #6a95b2;
            background: #f2f7fb;
            box-shadow: 0 0 0 8px rgba(100, 150, 180, 0.12);
        }

        .zone-self {
            background: #ecf8ef;
            border-color: #a3cfa8;
        }
        .zone-self .zone-header {
            background: #e0f3e4;
            color: #3d6b45;
        }
        .zone-self.drag-over-highlight {
            border-color: #5d9968;
            background: #f3faf5;
            box-shadow: 0 0 0 8px rgba(100, 160, 120, 0.12);
        }

        /* 按钮 */
        .footer-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all var(--transition-spring);
            font-family: inherit;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-reset {
            background: #f5efe6;
            color: #4a3728;
            border-color: #d5c9b5;
        }
        .btn-reset:hover {
            background: #ede5d8;
            border-color: #c4b599;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(120, 100, 60, 0.12);
        }
        .btn-reset:active {
            transform: scale(0.96);
            background: #e5dccb;
        }
        .btn-hint {
            background: #fff;
            color: #7a8c6e;
            border-color: #c8d5be;
        }
        .btn-hint:hover {
            background: #f8faf6;
            border-color: #a8bfa0;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #5c4a35;
            color: #fff;
            padding: 10px 22px;
            border-radius: 22px;
            font-size: 0.9rem;
            letter-spacing: 0.03em;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10000;
            white-space: nowrap;
            box-shadow: 0 6px 20px rgba(60, 40, 20, 0.3);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 响应式 */
        @media (max-width: 780px) {
            .drop-zones {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .drop-zone {
                max-width: none;
                min-height: 160px;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: flex-start;
                padding: 12px 10px;
                gap: 6px;
            }
            .drop-zone .zone-header {
                flex-shrink: 0;
                margin-right: 6px;
                font-size: 0.9rem;
                padding: 5px 10px;
            }
            .drop-zone .zone-inner {
                flex: 1;
                min-height: 60px;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px;
                align-content: flex-start;
                padding: 4px 2px;
            }
            .item-card {
                font-size: 0.82rem;
                padding: 7px 10px;
                gap: 4px;
                border-radius: 10px;
            }
            .item-card .emoji {
                font-size: 1.1rem;
            }
            .header h1 {
                font-size: 1.25rem;
            }
            .main-container {
                padding: 16px 10px 20px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <div class="icon-row">🚂✨</div>
            <h1>祖孙三代比童年</h1>
            <p class="subtitle">把物品拖拽到对应的方框中吧~</p>
        </div>

        <div class="item-pool-section">
            <div class="item-pool-label">📦 物品卡片（可拖拽）</div>
            <div class="item-pool" id="itemPool"></div>
        </div>

        <div class="drop-zones">
            <div class="drop-zone zone-grand" id="zoneGrand" data-zone="grand">
                <div class="zone-header">👴 祖辈的童年</div>
                <div class="zone-inner" id="zoneGrandInner">
                    <span class="zone-empty-hint">拖到这里~</span>
                </div>
            </div>
            <div class="drop-zone zone-parent" id="zoneParent" data-zone="parent">
                <div class="zone-header">👨 父辈的童年</div>
                <div class="zone-inner" id="zoneParentInner">
                    <span class="zone-empty-hint">拖到这里~</span>
                </div>
            </div>
            <div class="drop-zone zone-self" id="zoneSelf" data-zone="self">
                <div class="zone-header">🧒 自己的童年</div>
                <div class="zone-inner" id="zoneSelfInner">
                    <span class="zone-empty-hint">拖到这里~</span>
                </div>
            </div>
        </div>

        <div class="footer-actions">
            <button class="btn btn-reset" id="btnReset">🔄 重新开始</button>
            <button class="btn btn-hint" id="btnHint">💡 小提示</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="drag-clone" id="dragClone"></div>

    <script>
        (function() {
            // 物品定义：野菜→红薯，窝窝头→米饭
            const itemDefs = [
                { id: 'tufang', emoji: '🏚️', label: '土房', category: 'house' },
                { id: 'zhuanfang', emoji: '🏠', label: '砖房', category: 'house' },
                { id: 'gaolou', emoji: '🏢', label: '高楼大厦', category: 'house' },
                { id: 'hongshu', emoji: '🍠', label: '红薯', category: 'food' },
                { id: 'mifan', emoji: '🍚', label: '米饭', category: 'food' },
                { id: 'dayurou', emoji: '🍖', label: '大鱼大肉', category: 'food' },
                { id: 'zixingche', emoji: '🚲', label: '自行车', category: 'transport' },
                { id: 'diandongche', emoji: '🛵', label: '电动车', category: 'transport' },
                { id: 'xiaoqiche', emoji: '🚗', label: '小汽车', category: 'transport' },
            ];

            // DOM元素
            const itemPool = document.getElementById('itemPool');
            const zoneGrandInner = document.getElementById('zoneGrandInner');
            const zoneParentInner = document.getElementById('zoneParentInner');
            const zoneSelfInner = document.getElementById('zoneSelfInner');
            const zoneGrand = document.getElementById('zoneGrand');
            const zoneParent = document.getElementById('zoneParent');
            const zoneSelf = document.getElementById('zoneSelf');
            const dragClone = document.getElementById('dragClone');
            const toast = document.getElementById('toast');
            const btnReset = document.getElementById('btnReset');
            const btnHint = document.getElementById('btnHint');

            const zoneInnerMap = {
                grand: zoneGrandInner,
                parent: zoneParentInner,
                self: zoneSelfInner,
                pool: itemPool,
            };
            const zoneOuterMap = {
                grand: zoneGrand,
                parent: zoneParent,
                self: zoneSelf,
                pool: itemPool,
            };

            // 打乱数组
            function shuffleArray(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            function getZoneKeyFromElement(el) {
                let current = el;
                while (current) {
                    if (current.dataset && current.dataset.zone) return current.dataset.zone;
                    if (current === itemPool) return 'pool';
                    if (current === zoneGrand) return 'grand';
                    if (current === zoneParent) return 'parent';
                    if (current === zoneSelf) return 'self';
                    current = current.parentElement;
                }
                return null;
            }

            function updateZoneEmptyHint(zoneInner) {
                const cards = zoneInner.querySelectorAll('.item-card');
                const hint = zoneInner.querySelector('.zone-empty-hint');
                if (hint) hint.style.display = cards.length ? 'none' : '';
            }

            function updatePoolEmptyHint() {
                const cards = itemPool.querySelectorAll('.item-card');
                if (cards.length === 0) {
                    itemPool.classList.add('empty-hint');
                } else {
                    itemPool.classList.remove('empty-hint');
                }
            }

            function updateAllEmptyHints() {
                updateZoneEmptyHint(zoneGrandInner);
                updateZoneEmptyHint(zoneParentInner);
                updateZoneEmptyHint(zoneSelfInner);
                updatePoolEmptyHint();
            }

            // Toast 提示
            let toastTimer = null;
            function showToast(msg) {
                if (toastTimer) clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 1800);
            }

            // 创建卡片（不再使用 draggable）
            function createItemCard(def) {
                const card = document.createElement('div');
                card.className = `item-card ${def.category}-type`;
                card.dataset.itemId = def.id;
                card.dataset.emoji = def.emoji;
                card.dataset.label = def.label;
                card.dataset.category = def.category;
                card.innerHTML = `<span class="emoji">${def.emoji}</span><span class="label">${def.label}</span>`;

                // 使用 pointerdown 开始拖拽（兼容鼠标和触摸）
                card.addEventListener('pointerdown', onPointerDown);
                card.addEventListener('pointermove', onPointerMove);
                card.addEventListener('pointerup', onPointerUp);
                card.addEventListener('pointercancel', onPointerUp);
                // 防止触摸时页面拖动
                card.addEventListener('touchstart', (e) => {
                    if (e.target === card || card.contains(e.target)) {
                        // 不阻止，但设置 touch-action 已存在
                    }
                }, { passive: false });
                return card;
            }

            // 初始化物品池（打乱顺序）
            function populatePool() {
                itemPool.innerHTML = '';
                zoneGrandInner.innerHTML = '<span class="zone-empty-hint">拖到这里~</span>';
                zoneParentInner.innerHTML = '<span class="zone-empty-hint">拖到这里~</span>';
                zoneSelfInner.innerHTML = '<span class="zone-empty-hint">拖到这里~</span>';

                const shuffled = shuffleArray(itemDefs);
                shuffled.forEach(def => {
                    itemPool.appendChild(createItemCard(def));
                });
                updateAllEmptyHints();
            }

            // ========== 自定义拖拽逻辑（Pointer Events） ==========
            let dragCard = null;           // 正在拖拽的卡片
            let dragStartX = 0, dragStartY = 0;
            let dragActive = false;       // 是否已移动超过阈值
            const DRAG_THRESHOLD = 8;     // 像素阈值

            function onPointerDown(e) {
                // 单指或鼠标左键
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                if (dragCard) return; // 已经在拖拽

                const card = e.currentTarget;
                // 捕获指针，保证事件持续
                card.setPointerCapture(e.pointerId);

                dragCard = card;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                dragActive = false;

                card.classList.remove('dragging');
                e.preventDefault();
            }

            function onPointerMove(e) {
                if (!dragCard) return;
                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (!dragActive && dist < DRAG_THRESHOLD) return;

                if (!dragActive) {
                    // 首次超过阈值，激活拖拽
                    dragActive = true;
                    // 显示克隆体
                    const emoji = dragCard.dataset.emoji;
                    const label = dragCard.dataset.label;
                    dragClone.innerHTML = `<span class="emoji">${emoji}</span><span class="label">${label}</span>`;
                    dragClone.style.display = 'flex';
                    // 原卡片变暗
                    dragCard.classList.add('dragging');
                }

                // 移动克隆体
                dragClone.style.left = (e.clientX - dragClone.offsetWidth / 2) + 'px';
                dragClone.style.top = (e.clientY - dragClone.offsetHeight / 2) + 'px';

                // 检测下方区域并高亮
                clearAllHighlights();
                const targetKey = detectZoneAtPoint(e.clientX, e.clientY);
                if (targetKey) {
                    const outer = zoneOuterMap[targetKey];
                    if (outer) outer.classList.add('drag-over-highlight');
                }

                e.preventDefault();
            }

            function onPointerUp(e) {
                if (!dragCard) return;

                const card = dragCard;
                const wasActive = dragActive;
                const clientX = e.clientX;
                const clientY = e.clientY;

                // 释放指针捕获
                try { card.releasePointerCapture(e.pointerId); } catch (ex) {}

                // 清理状态
                dragCard = null;
                dragActive = false;
                dragClone.style.display = 'none';
                clearAllHighlights();
                card.classList.remove('dragging');

                if (!wasActive) {
                    // 没有移动，视为点击，不做任何操作（或者可以加单击效果）
                    return;
                }

                // 查找落点
                const targetKey = detectZoneAtPoint(clientX, clientY);
                if (targetKey) {
                    const inner = zoneInnerMap[targetKey];
                    if (inner && card.parentElement !== inner) {
                        inner.appendChild(card);
                        updateAllEmptyHints();
                        if (targetKey !== 'pool') {
                            const zoneName = targetKey === 'grand' ? '祖辈' : targetKey === 'parent' ? '父辈' : '自己';
                            showToast(`已放入「${zoneName}的童年」`);
                        } else {
                            showToast('已放回物品卡片池');
                        }
                    } else {
                        updateAllEmptyHints();
                    }
                } else {
                    // 没有目标，放回物品池
                    if (card.parentElement !== itemPool) {
                        itemPool.appendChild(card);
                        showToast('已放回物品卡片池');
                    }
                    updateAllEmptyHints();
                }
            }

            function detectZoneAtPoint(clientX, clientY) {
                // 隐藏克隆体以便检测
                const cloneDisplay = dragClone.style.display;
                dragClone.style.display = 'none';
                const el = document.elementFromPoint(clientX, clientY);
                dragClone.style.display = cloneDisplay;
                return el ? getZoneKeyFromElement(el) : null;
            }

            function clearAllHighlights() {
                [zoneGrand, zoneParent, zoneSelf, itemPool].forEach(el => {
                    el.classList.remove('drag-over-highlight');
                });
            }

            // 防止在拖拽过程中浏览器选中文本或触发其他行为
            document.addEventListener('selectstart', (e) => {
                if (dragCard) e.preventDefault();
            });

            // 重置按钮
            btnReset.addEventListener('click', () => {
                // 停止任何拖拽
                if (dragCard) {
                    onPointerUp({ clientX: 0, clientY: 0, pointerId: dragCard.dataset.pointerId });
                }
                // 重新打乱填充
                itemPool.innerHTML = '';
                zoneGrandInner.innerHTML = '<span class="zone-empty-hint">拖到这里~</span>';
                zoneParentInner.innerHTML = '<span class="zone-empty-hint">拖到这里~</span>';
                zoneSelfInner.innerHTML = '<span class="zone-empty-hint">拖到这里~</span>';
                const shuffled = shuffleArray(itemDefs);
                shuffled.forEach(def => itemPool.appendChild(createItemCard(def)));
                updateAllEmptyHints();
                showToast('已全部重置，顺序已打乱~');
                btnReset.style.transform = 'scale(0.9)';
                setTimeout(() => { btnReset.style.transform = ''; }, 200);
            });

            // 提示按钮
            btnHint.addEventListener('click', () => {
                const hints = [
                    '💡 没有标准答案！根据你家的实际情况来分类吧~',
                    '💡 想想看：祖辈小时候住什么样的房子？',
                    '💡 可以和小组同学讨论交流，分享彼此的想法~',
                    '💡 物品可以从方框中拖出来重新调整~',
                    '💡 每个家庭的经历都不一样，这正是改革开放带来的变化！',
                ];
                showToast(hints[Math.floor(Math.random() * hints.length)]);
                btnHint.style.transform = 'scale(0.9)';
                setTimeout(() => { btnHint.style.transform = ''; }, 200);
            });

            // 初始化
            populatePool();
            console.log('✅ 拖拽游戏已启动（基于Pointer Events，兼容鼠标与触摸）');
        })();
    </script>
</body>
</html>
